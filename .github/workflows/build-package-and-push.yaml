name: Prepare release
run-name: Prepare release

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      debug:
        description: Sets "NODE_ENV" to "debug".
        default: false
        type: boolean
      type:
        description: Sets semantic version update type.
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - candidate

jobs:
  main:
    # Allows pushing the version bump with its tag and dispatching the release
    # event.
    permissions:
      contents: write

    uses: thaibault/prepare-release-action/.github/workflows/prepare-and-dispatch-release.yaml@main
    with:
      debug: ${{ inputs.debug == true }}
      type: ${{ inputs.type }}
