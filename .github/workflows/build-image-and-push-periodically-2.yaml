name: Build image and push
run-name: Build image and push

on:
  # NOTE: Runs on version tag creation.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  # Runs when a new version was prepared.
  repository_dispatch:
    types:
      - prepare-pre-release-event
      - prepare-release-event
  # Run every Sunday at 2am o'clock.
  schedule:
    - cron: '0 2 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      architecture:
        default: all
        description: Architecture name to build for.
        type: choice
        options:
          - all
          - arm-64
          - x86-64
      build-args:
        description: List of build-time variables.
      build-target:
        description: Sets the target stage to build.

      tags:
        description: Image tags to use for registering.

      use-cache:
        description: Use cache when building the image.
        default: true
        type: boolean

jobs:
  main:
    permissions:
      contents: write
      packages: write

    uses: thaibault/build-image-push-action/.github/workflows/publish-repository-image.yaml@main
    with:
      architecture: ${{ inputs.architecture }}
      build-args: ${{ inputs.build-args }}
      build-target: ${{ inputs.build-target }}
      tags: ${{ inputs.tags }}
      use-cache: ${{ inputs.use-cache == true }}
    secrets:
      alternate-username: ${{ secrets.DOCKERHUB_USERNAME }}
      alternate-password: ${{ secrets.DOCKERHUB_TOKEN }}
